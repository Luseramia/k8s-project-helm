# prometheus-pve-exporter — สะพานดึง metrics จาก Proxmox VE API เข้า Prometheus
# Proxmox อยู่นอก cluster → exporter ตัวนี้รันในคลัสเตอร์แล้วคุยกับ PVE API :8006
#
# ต้องมีก่อน:
# 1. API token ใน Proxmox (role PVEAuditor)
# 2. เก็บ token ใน Vault: vault kv put observability/proxmox user=... token_name=... token_value=...
# 3. Prometheus scrape job (ดู additionalScrapeConfigs ใน kube-prometheus-stack-values.yaml)

---
# ดึง Proxmox API token จาก Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: proxmox-pve-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: proxmox-pve-exporter
    creationPolicy: Owner
  data:
    - secretKey: PVE_USER
      remoteRef:
        key: proxmox
        property: user
    - secretKey: PVE_TOKEN_NAME
      remoteRef:
        key: proxmox
        property: token_name
    - secretKey: PVE_TOKEN_VALUE
      remoteRef:
        key: proxmox
        property: token_value

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      containers:
        - name: pve-exporter
          image: ghcr.io/prometheus-pve/prometheus-pve-exporter:3.9.0    # ← pin version จริงหลังรู้ tag ที่มี
          ports:
            - name: http
              containerPort: 9221
          env:
            - name: PVE_VERIFY_SSL
              value: "false"    # Proxmox ใช้ self-signed cert → ปิด verify
          envFrom:
            - secretRef:
                name: proxmox-pve-exporter    # PVE_USER / PVE_TOKEN_NAME / PVE_TOKEN_VALUE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  selector:
    app.kubernetes.io/name: pve-exporter
  ports:
    - name: http
      port: 9221
      targetPort: 9221



apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-proxmox
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  proxmox-overview.json: |
    {
      "uid": "proxmox-overview",
      "title": "Proxmox VE Overview",
      "tags": ["proxmox", "infrastructure"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Node Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "pve_up{job=\"pve-exporter\",id=~\"node/.*\"}",
              "legendFormat": "{{id}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "DOWN", "color": "red"},
                    "1": {"text": "UP", "color": "green"}
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "red"},
                  {"value": 1, "color": "green"}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "VM Running",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(pve_up{job=\"pve-exporter\",id=~\"qemu/.*\"} == 1)",
              "legendFormat": "Running",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "fixed", "fixedColor": "green"},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "title": "VM Status",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "pve_up{job=\"pve-exporter\",id=~\"qemu/.*\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true
                },
                "renameByName": {
                  "id": "VM",
                  "Value": "Status"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"align": "auto"}
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Status"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {"text": "DOWN", "color": "red"},
                          "1": {"text": "UP", "color": "green"}
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {"type": "color-background"}
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 4,
          "title": "Node Memory Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * pve_memory_usage_bytes{job=\"pve-exporter\",id=~\"node/.*\"} / pve_memory_size_bytes{job=\"pve-exporter\",id=~\"node/.*\"}",
              "legendFormat": "{{id}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 5,
          "title": "Storage Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "100 * pve_disk_usage_bytes{job=\"pve-exporter\",id=~\"storage/.*\"} / pve_disk_size_bytes{job=\"pve-exporter\",id=~\"storage/.*\"}",
              "legendFormat": "{{id}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        }
      ]
    }
