      "uid": "vault-overview",
      "title": "Vault Overview",
      "tags": [
        "vault",
        "security",
        "infrastructure"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "refresh": 1
          }
        ]
