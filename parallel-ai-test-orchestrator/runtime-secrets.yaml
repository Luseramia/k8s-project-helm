# Object shells only. Argo CD creates these names so Jenkins can be granted
# update access without broad Secret creation rights. Secret data comes from
# Vault at runtime and is ignored by Argo CD; never add values to this file.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-gateway
  namespace: ai-test-system
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-codex-callback
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-test-callback
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-codex-auth
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
type: Opaque
data: {}
