# Runtime Secrets are deliberately absent from this GitOps directory. Jenkins
# creates them from Vault, matching the deployment pattern used by the other
# applications in this repository. Kubernetes RBAC cannot constrain "create"
# by resourceNames, so creation is namespaced while reads and writes remain
# limited to the expected Secret names.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-system
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ai-test-gateway"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-system
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
subjects:
  - kind: ServiceAccount
    name: kaniko
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-runtime-secret-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - ai-test-codex-callback
      - ai-test-test-callback
      - ai-test-codex-auth
      - ai-test-git-read
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
subjects:
  - kind: ServiceAccount
    name: kaniko
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-runtime-secret-manager
