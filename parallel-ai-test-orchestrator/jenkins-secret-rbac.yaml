# Argo CD pre-creates the named Secret objects; Jenkins may update only those
# objects from Vault. It cannot create or read any other Secret in either
# namespace and has no cluster-scoped access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-system
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ai-test-gateway"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-system
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
subjects:
  - kind: ServiceAccount
    name: kaniko
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-runtime-secret-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - ai-test-codex-callback
      - ai-test-test-callback
      - ai-test-codex-auth
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-runtime-secret-manager
  namespace: ai-test-runners
  labels:
    app.kubernetes.io/part-of: parallel-ai-test-orchestrator
subjects:
  - kind: ServiceAccount
    name: kaniko
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-runtime-secret-manager
