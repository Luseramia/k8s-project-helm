# Apply once from outside the ai-orchestrator application source path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-orchestrator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Luseramia/k8s-project-helm.git
    targetRevision: main
    path: ai-orchestrator
    directory:
      recurse: false
      include: '{configmap.yaml,deployment.yaml,service-account.yaml,service.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: codex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
