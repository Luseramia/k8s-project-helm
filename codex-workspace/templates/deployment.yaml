{{- if and .Values.gateway.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "The gateway requires replicaCount=1 because admission control and Codex authentication state are shared." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codex-workspace.fullname" . }}
  labels:
    {{- include "codex-workspace.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate avoids multiple Pods competing for ReadWriteOnce PVCs during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codex-workspace.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "codex-workspace.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: codex
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.gateway.enabled }}
          command: ["/usr/bin/tini", "--", "/opt/codex-gateway/venv/bin/python"]
          args: ["-m", "uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", {{ .Values.gateway.port | quote }}, "--workers", "1", "--timeout-graceful-shutdown", "15"]
          ports:
            - name: gateway
              containerPort: {{ .Values.gateway.port }}
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 7
            failureThreshold: 2
          {{- else }}
          command: ["bash", "-lc"]
          args: ["sleep infinity"]
          {{- end }}
          stdin: true
          tty: true
          workingDir: {{ .Values.workspace.mountPath | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "codex-workspace.fullname" . }}-env
          env:
            - name: HOME
              value: {{ .Values.home.mountPath | quote }}
            - name: CODEX_HOME
              value: {{ .Values.codex.state.mountPath | quote }}
            {{- if .Values.gateway.enabled }}
            - name: CODEX_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.existingSecret must name an existing Secret" .Values.gateway.existingSecret }}
                  key: {{ .Values.gateway.tokenKey }}
            - name: CODEX_WORKDIR
              value: {{ .Values.gateway.workdir | quote }}
            - name: CODEX_TIMEOUT_SECONDS
              value: {{ .Values.gateway.timeoutSeconds | quote }}
            - name: CODEX_MODEL
              value: {{ .Values.gateway.model | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workspace.mountPath }}
            - name: home
              mountPath: {{ .Values.home.mountPath }}
            - name: codex-state
              mountPath: {{ .Values.codex.state.mountPath }}
            {{- if .Values.gitSsh.enabled }}
            - name: git-ssh
              mountPath: {{ .Values.gitSsh.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          {{- if .Values.workspace.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "codex-workspace.fullname" . }}-workspace
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: home
          {{- if .Values.home.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "codex-workspace.fullname" . }}-home
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: codex-state
          {{- if .Values.codex.state.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "codex-workspace.fullname" . }}-codex-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.gitSsh.enabled }}
        - name: git-ssh
          secret:
            secretName: {{ .Values.gitSsh.existingSecret }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
