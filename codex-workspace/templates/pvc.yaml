{{- if .Values.workspace.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "codex-workspace.fullname" . }}-workspace
  labels:
    {{- include "codex-workspace.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.workspace.persistence.accessModes | nindent 4 }}
  {{- if .Values.workspace.persistence.storageClass }}
  storageClassName: {{ .Values.workspace.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspace.persistence.size }}
---
{{- end }}
{{- if .Values.home.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
