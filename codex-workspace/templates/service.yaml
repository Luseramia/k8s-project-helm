{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.serviceName }}
  labels:
    {{- include "codex-workspace.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "codex-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: gateway
      port: {{ .Values.gateway.port }}
      targetPort: gateway
      protocol: TCP
{{- end }}
