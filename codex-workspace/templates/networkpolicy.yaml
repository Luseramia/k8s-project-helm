{{- if and .Values.gateway.enabled .Values.gateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "codex-workspace.fullname" . }}-gateway
  labels:
    {{- include "codex-workspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codex-workspace.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default .Release.Namespace .Values.gateway.networkPolicy.allowedNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.gateway.networkPolicy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
{{- end }}
